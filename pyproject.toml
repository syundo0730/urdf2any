[project]
name = "urdf2any"
version = "0.1.0"
description = "Convert URDF robot descriptions to USD and MJCF without Isaac Sim or Omniverse"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Shundo Kishi" }]
keywords = ["urdf", "usd", "mjcf", "mujoco", "robotics", "simulation", "openusd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "usd-core>=24.5",
    "trimesh>=4.0",
    "scipy>=1.10",  # trimesh uses it for area-weighted vertex normals
]

[project.urls]
Homepage = "https://github.com/syundo0730/urdf2any"
Repository = "https://github.com/syundo0730/urdf2any"
Issues = "https://github.com/syundo0730/urdf2any/issues"

[project.optional-dependencies]
mjcf-validate = ["mujoco>=3.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mujoco>=3.0",
]

[project.scripts]
urdf2any = "urdf2any.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urdf2any"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
